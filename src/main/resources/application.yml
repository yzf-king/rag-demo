server:
  port: 8081

# PostgreSQL + pgvector（Docker 容器 rag-pg）
# 启动方式：docker run --name rag-pg -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
#   -e POSTGRES_DB=ragdb -p 5432:5432 -d pgvector/pgvector:pg16
spring:
  # 上传大小限制（默认只允许 1MB）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres

  # 排除 Spring AI 的 OpenAI 自动配置：chat/embedding/audio/image/moderation 六个
  # 自动配置都会强读一家 OpenAI 的 api-key，而我们手动建 DeepSeek + DashScope 两家
  # 的 bean（见 config/LlmConfig.java），自动配置反而捣乱。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# API Key 全部走环境变量，不进代码、不进 Git（同 W1 约定）
#   setx DEEPSEEK_API_KEY "sk-xxx"    # 已配置（W1 用过）
#   setx DASHSCOPE_API_KEY "sk-xxx"   # 阿里百炼，本作品新增，见 W2任务清单.md
llm:
  chat:
    base-url: https://api.deepseek.com
    model: deepseek-chat
    api-key: ${DEEPSEEK_API_KEY:}
  embedding:
    # 注意：base-url 不要带 /v1！Spring AI 客户端会自动拼 /v1/embeddings，
    # 写全了就会变成 .../v1/v1/embeddings → 404（9/5 实测踩过的坑）
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    model: text-embedding-v3
    api-key: ${DASHSCOPE_API_KEY:}